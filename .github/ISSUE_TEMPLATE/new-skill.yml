name: Propose a skill
description: A situation the set does not cover yet
labels: [skill]
body:
  - type: markdown
    attributes:
      value: |
        The bar is deliberately high: a skill earns its place by naming work that went
        wrong **twice**, not by completing a catalogue. Thirty-three model-invoked
        descriptions were already once too many here.

  - type: textarea
    id: failure
    attributes:
      label: What went wrong, twice
      description: The two concrete occasions. Not the category — the occasions.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: Which existing skill comes closest, and where exactly it stops short.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How an agent would know it has finished. If this cannot be checked, the skill has no end.
    validations:
      required: true

  - type: dropdown
    id: invocation
    attributes:
      label: Who triggers it
      description: |
        Hand-invoked is the default. Model-invoked is only for what a chain must reach
        without a human — and it costs context in every turn.
      options:
        - Hand-invoked (/its-name)
        - Model-invoked — a chain step cannot proceed without it
    validations:
      required: true
